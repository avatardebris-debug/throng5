[pytest]
testpaths =
    .
    tests
norecursedirs =
    PufferLib-3.0
    throng3 - Copy
    go-explore-master
    nes_venv
    checkpoints
    logs
    .git
    .pytest_cache
    __pycache__
markers =
    integration: tests requiring external services (OpenClaw gateway, etc.)
    slow: longer-running integration/pretrain checks excluded by -m "not slow"
